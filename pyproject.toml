[project]
name = "sentinelflow"
dynamic = ["version"]
description = "Real-time network threat detection with a live dashboard, PCAP replay and explainable, MITRE ATT&CK-mapped alerts."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "MeazbahMehedi" }, { name = "ItsMONIKAAKTER" }]
keywords = ["network-security", "intrusion-detection", "pcap", "flask", "threat-detection", "mitre-attack"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: Flask",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
  "Flask>=3.1.3,<3.2",
  "Werkzeug>=3.1.6,<3.2",
  "dpkt==1.9.8",
  "scapy==2.8.0",
  "Pillow>=12.1.1,<13",
  "waitress==3.0.2",
]

[project.urls]
Repository = "https://github.com/MeazbahMehedi/SentinelFlow"

[tool.setuptools.dynamic]
version = { attr = "sentinelflow.version.__version__" }

[tool.setuptools.packages.find]
include = ["sentinelflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["sentinelflow"]
omit = ["sentinelflow/capture.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["scripts/build_srs.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE"]
ignore = ["E501", "SIM105", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["sentinelflow"]
