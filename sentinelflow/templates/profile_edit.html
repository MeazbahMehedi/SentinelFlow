{% extends 'base.html' %}{% from 'macros.html' import icon,csrf with context %}{% block actions %}<a href="{{url_for('team')}}" class="button secondary">{{icon('arrow-left')}} Back to developers</a>{% endblock %}{% block content %}<form method="post" enctype="multipart/form-data" class="panel padded stack-form profile-form">{{csrf()}}<div class="form-grid"><label>Full name<input name="name" value="{{profile.name}}" maxlength="80" required></label><label>Role and contribution<input name="role" value="{{profile.role}}" maxlength="120"></label></div><label>About you<textarea name="bio" rows="5" maxlength="3000">{{profile.bio}}</textarea></label><label>Skills separated by commas<input name="skills" value="{{profile.skills}}" maxlength="500"></label><div class="form-grid"><label>Email<input name="email" value="{{profile.email}}" type="email" maxlength="160"></label><label>GitHub URL<input name="github" value="{{profile.github}}" type="url" maxlength="300" placeholder="https://github.com/yourname"></label><label>LinkedIn URL<input name="linkedin" value="{{profile.linkedin}}" type="url" maxlength="300"></label><label>Portfolio URL<input name="website" value="{{profile.website}}" type="url" maxlength="300"></label><label>Profile photo<input type="file" name="photo" accept="image/png,image/jpeg,image/webp"><small>Up to 5 MiB and 20 megapixels. Saved as a clean PNG.</small></label><label>Curriculum vitae<input type="file" name="cv" accept="application/pdf,.pdf"><small>PDF only · up to 5 MiB. Leaving files empty preserves existing uploads.</small></label></div><div class="save-bar"><span class="small muted">Your profile and uploads stay in this workspace.</span><button class="button primary">{{icon('check')}} Save developer profile</button></div></form>{% endblock %}
